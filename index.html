<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A63">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Pruebas KNX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lista de proyectos, ficha de proyecto con secciones plegables y filas de prueba con botones OK / Fallo / N/A.
   Motivo: etiquetas de aparamenta de carril DIN (tipografía condensada) y direcciones de grupo en monoespaciada. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --fg:#13201D; --muted:#566764; --line:#D2DBD9;
  --accent:#0E5A63; --on-accent:#FFFFFF;
  --ok:#12794A; --fail:#B3261E; --na:#566764; --on-solid:#FFFFFF;
  --ok-soft:#DCF1E5; --fail-soft:#FBE2DF;
  --font-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1615; --surface:#162220; --fg:#E5EEEC; --muted:#92A6A2; --line:#283936;
    --accent:#5CC0CB; --on-accent:#04201F;
    --ok:#4FC58C; --fail:#FF8F86; --na:#92A6A2; --on-solid:#07130E;
    --ok-soft:#14382A; --fail-soft:#3D1B19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1615; --surface:#162220; --fg:#E5EEEC; --muted:#92A6A2; --line:#283936;
  --accent:#5CC0CB; --on-accent:#04201F;
  --ok:#4FC58C; --fail:#FF8F86; --na:#92A6A2; --on-solid:#07130E;
  --ok-soft:#14382A; --fail-soft:#3D1B19; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;min-height:54px}
.bar h1{flex:1;min-width:0;margin:0;font:700 21px/1.1 var(--font-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back,.lnk{appearance:none;border:0;background:none;padding:10px 0;min-height:44px;color:var(--accent);font:600 15px var(--font-display);letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.lnk.dng{color:var(--fail);padding:6px 0;min-height:36px;text-align:left}
.main{padding-block:16px 56px;display:grid;gap:16px;align-content:start}
.stack{display:grid;gap:14px}

/* botones y campos */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:600 15px var(--font-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 150px}
.lbl{margin:0;font:600 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font:600 12px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea,.add input{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:16px var(--font-body)}
.fld textarea{resize:vertical;min-height:72px}
.mono{font-family:var(--font-mono)!important;font-size:15px!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint-p{margin:0;color:var(--muted);font-size:14px}

/* lista de proyectos */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.empty{padding:20px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted)}
.card{appearance:none;display:grid;gap:10px;width:100%;padding:14px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font:700 20px/1.15 var(--font-display);min-width:0;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tag{flex:none;padding:2px 8px;border:1px solid var(--line);border-radius:4px;font:600 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prog{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.prog i{display:block;height:100%}
.prog .p-ok{background:var(--ok)}.prog .p-fail{background:var(--fail)}.prog .p-na{background:var(--na)}
.cnts{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;font:600 13px var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cnts .c-ok{color:var(--ok)}.cnts .c-fail{color:var(--fail)}

/* pestañas y resumen */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;flex:1;min-height:46px;border:0;border-bottom:3px solid transparent;background:none;font:600 15px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.sum{display:grid;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pct{font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pct small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.verdict{font:700 13px var(--font-display);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;background:var(--line);color:var(--fg)}
.verdict.v-ok{background:var(--ok-soft);color:var(--ok)}
.verdict.v-fail{background:var(--fail-soft);color:var(--fail)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{appearance:none;min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:20px;background:transparent;font:600 13px var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* secciones y pruebas */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);padding-right:12px}
.sec-btn{appearance:none;flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:0;background:none;text-align:left;cursor:pointer}
.sec-name{font:700 16px var(--font-display);letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.sec-n{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sec-t{flex:1;min-width:0;min-height:48px;padding:0 14px;border:0;background:none;font:700 16px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.s-fail{background:var(--fail-soft)}
.item-h{appearance:none;display:grid;gap:3px;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.item-l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.ga{font:500 13px var(--font-mono);color:var(--accent);padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.hint{font-size:14px;color:var(--muted)}
.more{appearance:none;justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:1.5px dashed var(--line);border-radius:6px;background:transparent;color:var(--accent);font:600 13px var(--font-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.more span{font-size:11px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{appearance:none;min-height:42px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);font:700 14px var(--font-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.seg button[aria-pressed="true"][data-v="fail"]{background:var(--fail);border-color:var(--fail);color:var(--on-solid)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);border-color:var(--na);color:var(--on-solid)}
.detail{display:grid;gap:12px;padding-top:4px}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{appearance:none;position:absolute;top:2px;right:2px;width:30px;height:30px;border:0;border-radius:15px;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.ph-add{cursor:pointer}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;background:var(--bg)}
.sec-add{padding:0;border:0}

/* informe y listas */
.panel{display:grid;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel h2{margin:0;font:700 18px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.inc{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.inc li{display:grid;gap:3px;padding-top:10px;border-top:1px solid var(--line)}
.inc li:first-child{border-top:0;padding-top:0}
.inc .n{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.trow{display:grid;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.trow h3{margin:0;font:700 19px var(--font-display);overflow-wrap:anywhere}
.trow .sub{color:var(--muted);font-size:14px}
.trow .row{display:flex;gap:16px;flex-wrap:wrap}
.banner{padding:14px;border:1.5px solid var(--accent);border-radius:8px;display:grid;gap:10px}

/* aviso */
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92vw,420px);padding:11px 16px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
var KEY='knx-pruebas-v1';
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var $app=document.getElementById('app'),$toast=document.getElementById('toast');
var ui={view:'home',pid:null,tid:null,tab:'pruebas',filter:'all',open:new Set(),shut:new Set(),confirm:null,pendingImport:null};

function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return '';var a=s.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s;}

/* ---------- datos ---------- */
function mkItem(t,h,ga){return {id:uid(),t:t,h:h||'',ga:ga||'',pa:'',s:'pend',n:'',ph:[]};}
function mkSec(title,items){return {id:uid(),title:title,items:items};}
function defaultTemplates(){
  var I=mkItem,S=mkSec;
  return [
    {id:uid(),name:'Puesta en marcha general',sections:[
      S('Bus y alimentación',[
        I('Tensión de bus correcta','Medir en la fuente. Valor habitual entre 28 y 30 V CC.'),
        I('Una fuente con choke por línea','Cada línea con su fuente y sin superar la corriente máxima.'),
        I('Polaridad del bus respetada','Rojo con rojo (+) y negro con negro (-) en todos los bornes.'),
        I('Sin cortocircuitos ni derivaciones','El bus responde al conectar la interfaz.')]),
      S('Programación en ETS',[
        I('Direcciones físicas sin duplicados','Revisar la topología del proyecto.'),
        I('Aplicación descargada en todos los dispositivos','Ninguno en estado de programación pendiente.'),
        I('Interfaz IP o USB conecta con el bus','Comprobar que ETS detecta la línea.'),
        I('Descarga sin avisos ni errores','Revisar la ventana de resultados de ETS.')])]},
    {id:uid(),name:'Iluminación',sections:[
      S('Conmutación',[
        I('Encendido y apagado desde el pulsador','Pulsar y comprobar que el actuador conmuta.'),
        I('El estado de la luz se refleja en el pulsador','Comprobar el LED o el icono de estado.'),
        I('Apagado general','Todas las luces del grupo se apagan.')]),
      S('Regulación',[
        I('Regulación relativa con pulsación larga','Sube y baja sin saltos.'),
        I('Valor de brillo en porcentaje','Enviar 25, 50 y 100 por ciento.'),
        I('Brillo mínimo al encender','Sin parpadeo ni zumbido.')]),
      S('Escenas y detectores',[
        I('Escena llamada desde el pulsador','Comprobar cada luz de la escena.'),
        I('Detector de presencia enciende y apaga con retardo','Probar el tiempo de apagado configurado.'),
        I('Estado tras corte y vuelta del bus','Debe coincidir con el estado de arranque programado.')])]},
    {id:uid(),name:'Persianas y toldos',sections:[
      S('Movimiento',[
        I('Subir y bajar','Recorrido completo en ambos sentidos.'),
        I('Parada con pulsación corta','Se detiene en cualquier posición.'),
        I('Posición en porcentaje','Enviar 0, 50 y 100 por ciento.'),
        I('Orientación de lamas','Solo si el actuador la admite.'),
        I('Tiempo de recorrido calibrado','La posición coincide con el valor mostrado.')]),
      S('Seguridad',[
        I('Alarma de viento sube la persiana','Bloquea el mando manual mientras dure la alarma.'),
        I('Fin de alarma devuelve el control','Comprobar que el mando vuelve a responder.')])]},
    {id:uid(),name:'Climatización',sections:[
      S('Regulación',[
        I('Temperatura medida correcta','Comparar con un termómetro de referencia.'),
        I('Consigna y modos','Confort, noche y ausencia cambian la consigna.'),
        I('La válvula o el actuador de calefacción responde','Comprobar apertura y cierre.'),
        I('El contacto de ventana corta la climatización','Abrir y cerrar la ventana.'),
        I('Pasarela de aire acondicionado','Encendido, modo y velocidad desde KNX.')])]},
    {id:uid(),name:'Entrega al cliente',sections:[
      S('Documentación',[
        I('Dispositivos etiquetados en el cuadro','Etiquetas con dirección física.'),
        I('Copia del proyecto ETS entregada','En formato .knxproj.'),
        I('Contraseña del proyecto entregada','Anotada y comunicada al cliente.'),
        I('Listado de direcciones de grupo entregado','Impreso o en digital.'),
        I('Formación básica al usuario','Funciones principales y escenas.')])]}
  ];
}
function cloneSections(secs){return secs.map(function(s){return {id:uid(),title:s.title,items:s.items.map(function(i){return {id:uid(),t:i.t,h:i.h||'',ga:i.ga||'',pa:'',s:'pend',n:'',ph:[]};})};});}
function mkProject(meta,tpl){return {id:uid(),name:meta.name,client:meta.client||'',site:meta.site||'',tester:meta.tester||'',date:today(),created:Date.now(),sections:tpl?cloneSections(tpl.sections):[mkSec('Pruebas',[])]};}
function seed(){
  var tpls=defaultTemplates();
  var ex=mkProject({name:'Vivienda unifamiliar',client:'Cliente de ejemplo',site:'Calle Mayor 12, planta baja'},tpls[1]);
  ex.example=true;
  var its=[];ex.sections.forEach(function(s){s.items.forEach(function(i){its.push(i);});});
  its[0].s='ok';its[0].ga='1/1/1';its[0].pa='1.1.4';
  its[1].s='ok';its[1].ga='1/1/2';its[1].pa='1.1.4';
  its[2].s='fail';its[2].ga='1/1/3';its[2].pa='1.1.5';its[2].n='El actuador no responde al pulsador del pasillo. Revisar el enlace del objeto de comunicación.';
  its[3].s='ok';its[3].ga='1/2/1';its[3].pa='1.1.6';
  its[4].s='na';
  return {settings:{company:'',tester:''},templates:tpls,projects:[ex]};
}
function norm(s){
  s.settings=s.settings||{};s.settings.company=s.settings.company||'';s.settings.tester=s.settings.tester||'';
  s.templates=Array.isArray(s.templates)?s.templates:[];s.projects=Array.isArray(s.projects)?s.projects:[];
  var fix=function(d){d.sections=Array.isArray(d.sections)?d.sections:[];d.sections.forEach(function(x){x.id=x.id||uid();x.items=Array.isArray(x.items)?x.items:[];x.items.forEach(function(i){i.id=i.id||uid();i.t=i.t||'';i.h=i.h||'';i.ga=i.ga||'';i.pa=i.pa||'';i.n=i.n||'';i.s=['ok','fail','na','pend'].indexOf(i.s)>-1?i.s:'pend';i.ph=Array.isArray(i.ph)?i.ph:[];});});};
  s.templates.forEach(function(t){t.id=t.id||uid();t.name=t.name||'Plantilla';fix(t);});
  s.projects.forEach(function(p){p.id=p.id||uid();p.created=p.created||Date.now();p.name=p.name||'Proyecto';fix(p);});
  return s;
}
var state;
try{var raw=localStorage.getItem(KEY);if(raw)state=norm(JSON.parse(raw));}catch(e){}
if(!state)state=seed();
var tmr;
function save(){clearTimeout(tmr);try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('No se pudo guardar en este dispositivo. Exporta una copia y borra fotos.');}}
function saveSoon(){clearTimeout(tmr);tmr=setTimeout(save,400);}
window.addEventListener('pagehide',save);

function curProject(){return state.projects.find(function(p){return p.id===ui.pid;});}
function curTemplate(){return state.templates.find(function(t){return t.id===ui.tid;});}
function curDoc(){return ui.view==='template'?curTemplate():curProject();}
function findItem(iid){var d=curDoc();if(!d)return null;for(var a=0;a<d.sections.length;a++){var f=d.sections[a].items.find(function(i){return i.id===iid;});if(f)return f;}return null;}
function counts(p){var c={ok:0,fail:0,na:0,pend:0,total:0};p.sections.forEach(function(s){s.items.forEach(function(i){c[i.s]++;c.total++;});});return c;}
function verdict(c){if(c.fail>0)return {t:'Con incidencias',cls:'v-fail'};if(c.pend>0)return {t:'En curso',cls:''};if(c.total===0)return {t:'Sin pruebas',cls:''};return {t:'Conforme',cls:'v-ok'};}
function pc(n,c){return c.total?(n*100/c.total):0;}

/* ---------- vistas ---------- */
function bar(title,o){
  o=o||{};
  return '<header class="bar"><div class="wrap bar-in">'+
    (o.back?'<button class="back" data-act="'+o.back+'">‹ '+esc(o.backLabel||'Atrás')+'</button>':'')+
    '<h1>'+esc(title)+'</h1>'+(o.right||'')+'</div></header>';
}
function progress(c){return '<div class="prog" aria-hidden="true"><i class="p-ok" style="width:'+pc(c.ok,c)+'%"></i><i class="p-fail" style="width:'+pc(c.fail,c)+'%"></i><i class="p-na" style="width:'+pc(c.na,c)+'%"></i></div>';}
function cntsLine(c){return '<p class="cnts"><span class="c-ok">'+c.ok+' OK</span><span class="c-fail">'+c.fail+(c.fail===1?' fallo':' fallos')+'</span><span>'+c.na+' N/A</span><span>'+c.pend+(c.pend===1?' pendiente':' pendientes')+'</span></p>';}

function vHome(){
  var ps=state.projects.slice().sort(function(a,b){return b.created-a.created;});
  var cards=ps.map(function(p){

function removeItem(iid){var d=curDoc();d.sections.forEach(function(s){s.items=s.items.filter(function(i){return i.id!==iid;});});}
function summaryText(p){
  var c=counts(p),L=['Informe KNX: '+p.name,'Cliente: '+(p.client||'-')+' | Instalación: '+(p.site||'-')+' | Fecha: '+fmtDate(p.date),'Resultado: '+verdict(c).t+'. OK '+c.ok+', Fallo '+c.fail+', N/A '+c.na+', Pendiente '+c.pend+'.'];
  p.sections.forEach(function(s){s.items.forEach(function(i){if(i.s==='fail')L.push('FALLO - '+s.title+': '+i.t+(i.ga?' ('+i.ga+')':'')+(i.n?'. '+i.n:''));});});

function copyText(txt,okMsg){
  var fallback=function(){toast('No se pudo copiar desde aquí.');};
  try{navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},fallback);}catch(e){fallback();}

function download(name,text,type){var b=new Blob([text],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
function backupJSON(){return JSON.stringify({v:1,exported:Date.now(),settings:state.settings,templates:state.templates,projects:state.projects});}
function shrink(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

function makePDF(p){
  if(!window.jspdf||!window.jspdf.jsPDF){toast('No se pudo cargar el generador de PDF. Comprueba la conexión.');return;}
  var d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var M=16,PW=210,CW=PW-M*2,BOT=282,y=M;
  var INK=[19,32,29],MUT=[86,103,100],TEAL=[14,90,99],OK=[18,121,74],BAD=[179,38,30],LINE=[210,219,217];
  var c=counts(p);
  function need(h){if(y+h>BOT){d.addPage();y=M;}}
  function put(s,x,size,style,col,opt){d.setFont('helvetica',style);d.setFontSize(size);d.setTextColor(col[0],col[1],col[2]);d.text(s,x,y,opt);}
  function rule(col,w){d.setDrawColor(col[0],col[1],col[2]);d.setLineWidth(w);d.line(M,y,M+CW,y);}
  var company=(state.settings.company||'').trim();
  if(company){put(company.toUpperCase(),M,9,'bold',TEAL);y+=5;}
  put('INFORME DE PUESTA EN MARCHA KNX',M,8.5,'normal',MUT);y+=9;
  d.setFont('helvetica','bold');d.setFontSize(19);
  var tl=d.splitTextToSize(p.name,CW);put(tl,M,19,'bold',INK);y+=tl.length*7.8+1;
  function meta(label,val,x){put(label.toUpperCase(),x,7.5,'bold',MUT);y+=4.6;var l=d.splitTextToSize(val||'-',CW/2-4);put(l,x,10.5,'normal',INK);y-=4.6;return l.length;}
  var n1=meta('Cliente',p.client,M),n2=meta('Fecha',fmtDate(p.date),M+CW/2);y+=4.6+Math.max(n1,n2)*4.8+3;
  n1=meta('Instalación',p.site,M);n2=meta('Técnico',p.tester||state.settings.tester,M+CW/2);y+=4.6+Math.max(n1,n2)*4.8+3;
  rule(LINE,.3);y+=7;
  put('RESULTADO: '+verdict(c).t.toUpperCase(),M,12,'bold',c.fail?BAD:(c.pend?MUT:OK));y+=6;
  put('OK '+c.ok+'    Fallo '+c.fail+'    N/A '+c.na+'    Pendiente '+c.pend+'    Total '+c.total,M,9.5,'normal',INK);y+=9;
  p.sections.forEach(function(s){
    if(!s.items.length)return;
    need(18);put(s.title.toUpperCase(),M,10,'bold',TEAL);y+=2;rule(TEAL,.4);y+=5;
    s.items.forEach(function(i){
      var tl2=d.splitTextToSize(i.t,100);
      var gl=[i.ga?'GA '+i.ga:'',i.pa?'PA '+i.pa:''].filter(Boolean);
      var nl=i.n?d.splitTextToSize('Nota: '+i.n,CW-4):[];
      var h=Math.max(tl2.length*4.6,gl.length*4.2,4.6);
      need(h+nl.length*4.1+4);
      put(tl2,M,9.5,'normal',INK);
      gl.forEach(function(g,k){y+=k*4.2;put(g,M+106,8.5,'normal',MUT);y-=k*4.2;});
      var res=i.s==='ok'?['OK',OK]:i.s==='fail'?['FALLO',BAD]:i.s==='na'?['N/A',MUT]:['PENDIENTE',MUT];
      put(res[0],PW-M,9,'bold',res[1],{align:'right'});
      y+=h;
      if(nl.length){put(nl,M+2,8.5,'italic',MUT);y+=nl.length*4.1;}
      y+=1.5;rule(LINE,.2);y+=3;
      for(var a=0;a<i.ph.length;a+=3){
        var row=i.ph.slice(a,a+3),W=56,hs=row.map(function(src){try{var pr=d.getImageProperties(src);return Math.min(46,W*pr.height/pr.width);}catch(e){return 42;}}),rh=Math.max.apply(null,hs);
        need(rh+9);y+=2;
        row.forEach(function(src,k){try{d.addImage(src,'JPEG',M+k*(W+3),y,W,hs[k]);}catch(e){}});
        y+=rh+6;
      }
    });
    y+=3;
  });
  need(36);y+=12;
  d.setDrawColor(INK[0],INK[1],INK[2]);d.setLineWidth(.3);
  d.line(M,y,M+70,y);d.line(M+CW-70,y,M+CW,y);y+=4.5;
  put('Firma del técnico',M,8.5,'normal',MUT);put('Firma del cliente',M+CW-70,8.5,'normal',MUT);
  var np=d.getNumberOfPages();
  for(var k=1;k<=np;k++){d.setPage(k);y=291;put(p.name,M,8,'normal',MUT);put('Página '+k+' de '+np,PW-M,8,'normal',MUT,{align:'right'});}
  var slug=p.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'proyecto';
  d.save('Informe-KNX-'+slug+'.pdf');
  toast('Informe generado.');
}

/* ---------- eventos ---------- */
$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||!$app.contains(b))return;
  var a=b.dataset.act,D=b.dataset;
  if(a.indexOf('del-')!==0)ui.confirm=null;
  switch(a){
    case 'home':go('home');break;
    case 'settings':go('settings');break;
    case 'templates':go('templates');break;
    case 'new-project':go('new');break;
    case 'open-project':ui.pid=D.pid;ui.tab='pruebas';ui.filter='all';ui.open.clear();go('project');break;
    case 'tab':ui.tab=D.tab;render(true);break;
    case 'filter':ui.filter=D.v;render();break;
    case 'toggle-section':if(ui.shut.has(D.sid))ui.shut.delete(D.sid);else ui.shut.add(D.sid);render();break;
    case 'toggle-item':if(ui.open.has(D.iid))ui.open.delete(D.iid);else ui.open.add(D.iid);render();break;
    case 'set':{var it=findItem(D.iid);if(it){it.s=it.s===D.v?'pend':D.v;save();render();}break;}
    case 'del-item':if(sure('it'+D.iid)){removeItem(D.iid);save();render();}break;
    case 'del-section':if(sure('sec'+D.sid)){var t=curTemplate();t.sections=t.sections.filter(function(s){return s.id!==D.sid;});save();render();}break;
    case 'rm-photo':{var it2=findItem(D.iid);if(it2){it2.ph.splice(+D.k,1);save();render();}break;}
    case 'del-project':if(sure('proj')){state.projects=state.projects.filter(function(p){return p.id!==ui.pid;});save();go('home');}break;
    case 'save-as-template':{var p=curProject();state.templates.push({id:uid(),name:p.name+' (plantilla)',sections:cloneSections(p.sections)});save();toast('Plantilla guardada.');break;}
    case 'open-template':ui.tid=D.tid;ui.open.clear();go('template');break;
    case 'dup-template':{var s0=state.templates.find(function(x){return x.id===D.tid;});state.templates.push({id:uid(),name:s0.name+' (copia)',sections:cloneSections(s0.sections)});save();render();break;}
    case 'del-template':if(sure('tpl'+D.tid)){state.templates=state.templates.filter(function(x){return x.id!==D.tid;});save();render();}break;
    case 'pdf':makePDF(curProject());break;
    case 'copy-summary':copyText(summaryText(curProject()),'Resumen copiado.');break;
    case 'export':try{download('copia-pruebas-knx-'+today()+'.json',backupJSON(),'application/json');toast('Copia exportada.');}catch(err){toast('No se pudo exportar.');}break;
    case 'copy-backup':copyText(backupJSON(),'Copia copiada al portapapeles.');break;
    case 'confirm-import':state=norm(ui.pendingImport);ui.pendingImport=null;save();toast('Copia importada.');render();break;
    case 'cancel-import':ui.pendingImport=null;render();break;
  }
});
$app.addEventListener('input',function(e){
  var t=e.target,f=t.dataset.f;if(!f)return;
  var sc=t.dataset.scope;
  if(sc==='settings')state.settings[f]=t.value;
  else if(sc==='proj'){var p=curProject();if(p)p[f]=t.value;}
  else if(sc==='tplname'){var tp=curTemplate();if(tp)tp.name=t.value;}
  else if(f==='stitle'){var d=curDoc();var s=d.sections.find(function(x){return x.id===t.dataset.sid;});if(s)s.title=t.value;}
  else if(t.dataset.iid){
    var it=findItem(t.dataset.iid);if(!it)return;it[f]=t.value;
    var li=$app.querySelector('li[data-iid="'+t.dataset.iid+'"]');
    var el=li&&li.querySelector('[data-show="'+f+'"]');
    if(el){el.textContent=t.value;if(f!=='t')el.hidden=!t.value;}
  }
  saveSoon();
});
$app.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var fd=new FormData(f),t=String(fd.get('t')||'').trim();
  switch(f.dataset.form){
    case 'add-item':{if(!t)return;var d=curDoc(),s=d.sections.find(function(x){return x.id===f.dataset.sid;});s.items.push(mkItem(t));save();render();var inp=$app.querySelector('form[data-sid="'+f.dataset.sid+'"] input');if(inp)inp.focus();break;}
    case 'add-section':{if(!t)return;curDoc().sections.push(mkSec(t,[]));save();render();break;}
    case 'new-template':{if(!t)return;var nt={id:uid(),name:t,sections:[mkSec('Pruebas',[])]};state.templates.push(nt);save();ui.tid=nt.id;ui.open.clear();go('template');break;}
    case 'create-project':{
      var name=String(fd.get('name')||'').trim();if(!name)return;
      var tpl=state.templates.find(function(x){return x.id===fd.get('tpl');});
      var p=mkProject({name:name,client:String(fd.get('client')||'').trim(),site:String(fd.get('site')||'').trim(),tester:String(fd.get('tester')||'').trim()},tpl);
      state.projects.push(p);save();ui.pid=p.id;ui.tab='pruebas';ui.filter='all';ui.open.clear();go('project');break;
    }
  }
});
$app.addEventListener('change',async function(e){
  var t=e.target,k=t.dataset.change;if(!k)return;
  if(k==='photo'){
    var it=findItem(t.dataset.iid);if(!it)return;
    var files=Array.prototype.slice.call(t.files);
    for(var n=0;n<files.length;n++){try{it.ph.push(await shrink(files[n]));}catch(err){toast('No se pudo leer una de las fotos.');}}
    save();ui.open.add(it.id);render();
  }else if(k==='import'){
    var fl=t.files[0];if(!fl)return;
    try{var data=JSON.parse(await fl.text());if(!Array.isArray(data.projects)||!Array.isArray(data.templates))throw new Error('x');ui.pendingImport=data;render();}
    catch(err){toast('El archivo no es una copia válida.');}
  }
});

save();
render(true);
})();
</script>
</body>
</html>
